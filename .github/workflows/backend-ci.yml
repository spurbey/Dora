name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**']
  pull_request:
    paths: ['backend/**']

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install ruff pytest pytest-cov

      - name: Lint
        run: ruff check app/

      - name: Check migrations
        env:
          SUPABASE_URL: http://localhost:fake
          SUPABASE_ANON_KEY: fake-anon-key
          SUPABASE_DB_URL: postgresql://test:test@localhost:5432/dora_test
          SUPABASE_SERVICE_ROLE_KEY: fake-service-role-key
          FOURSQUARE_API_KEY: fake-fsq-key
          MAPBOX_API_KEY: fake-mapbox-key
          SECRET_KEY: ci-test-secret-key-not-default
          DEBUG: "true"
        run: alembic check

      - name: Run tests
        env:
          SUPABASE_URL: http://localhost:fake
          SUPABASE_ANON_KEY: fake-anon-key
          SUPABASE_DB_URL: postgresql://test:test@localhost:5432/dora_test
          SUPABASE_SERVICE_ROLE_KEY: fake-service-role-key
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/dora_test
          FOURSQUARE_API_KEY: fake-fsq-key
          MAPBOX_API_KEY: fake-mapbox-key
          SECRET_KEY: ci-test-secret-key-not-default
          DEBUG: "true"
        run: pytest --cov=app --cov-report=term-missing -v
