name: Flutter CI

on:
  push:
    branches: [main]
    paths: ['flutter/**']
  pull_request:
    paths: ['flutter/**']

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        # TODO: Burn down 119 pre-existing issues, then remove continue-on-error
        continue-on-error: true
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test
