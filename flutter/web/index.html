<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Dora — travel memory vault. Plan trips, capture moments, relive journeys. No install needed.">
  <meta name="theme-color" content="#0A0A0B">

  <!-- sql.js for Drift (offline-first SQLite on web). Pinned version must
       match the sql-wasm.wasm asset served next to index.html. -->
  <script src="sql-wasm.js" defer></script>

  <!-- Mapbox GL JS for the web map (same token/styles as mobile). -->
  <link href="https://cdn.jsdelivr.net/npm/mapbox-gl@3/dist/mapbox-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/mapbox-gl@3/dist/mapbox-gl.js" defer></script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="dora">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Dora - Travel Memory Vault</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
