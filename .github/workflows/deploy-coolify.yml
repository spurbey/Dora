name: Deploy to Coolify

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "video-renderer/**"
      - "docker-compose.coolify.yml"
      - ".github/workflows/deploy-coolify.yml"
  workflow_dispatch:

concurrency:
  group: coolify-deploy
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run migrations
        working-directory: backend
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Config requires these even though migrations don't use them directly.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FOURSQUARE_API_KEY: placeholder
          MAPBOX_API_KEY: placeholder
          SECRET_KEY: migration-runner-not-serving
          DEBUG: "true"
        run: alembic upgrade head

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_WEBHOOK:-}" ]; then
            echo "Missing COOLIFY_WEBHOOK secret"
            exit 1
          fi
          if [ -z "${COOLIFY_TOKEN:-}" ]; then
            echo "Missing COOLIFY_TOKEN secret"
            exit 1
          fi

          curl --fail --show-error --silent --request GET "${COOLIFY_WEBHOOK}" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}"
          echo "Coolify deployment triggered."
